name: release
run-name: release ${{ github.ref_name }}${{ !startsWith(github.ref, 'refs/tags/v') && ' (dry run)' || '' }}

# A `vX.Y.Z[-pre]` tag publishes, from one Docker build on the self-hosted CI VM:
# - image ghcr.io/popodidi/axe:<tag> (its digest is in the release notes)
# - axe-<tag>-linux-x86_64.tar.gz: the image's `axe` binary (dashboard embedded)
# - axe-<tag>-macos-aarch64.tar.gz: a macOS arm64 `axe` (default features),
#   built by the `macos` job on a GitHub-hosted runner
# - axe-skills-<tag>.tar.gz: skills/axe
# - a .sha256 file per asset and SHA256SUMS
# The `gate` job first runs ci.yml in full on GitHub-hosted runners (feature
# variants, embed-ui, web); nothing is built or published unless it passes,
# and nothing is published unless the tagged commit is on main. Each binary
# embeds skills/axe (`axe skill install`); `axe upgrade` downloads the binary
# tarball for its platform and checks it against `<asset>.sha256`.
# Publishing to crates.io is not done here (no repository secrets); the job
# only runs `cargo publish --dry-run`. A tag is never reused: a failed release
# is retried with a new tag.
#
# Pushing a `release-dry-run/<name>` branch is a dry run of the same path at
# that commit: the gate, the image build and its smoke test, and the assets,
# with nothing pushed or published. Delete the branch afterwards. (A branch
# push rather than workflow_dispatch: the CI VM schedules only push and
# pull_request events for this public repository.)
on:
  push:
    tags: ["v*"]
    branches: ["release-dry-run/**"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Build parallelism (CARGO_BUILD_JOBS, MAKEFLAGS) comes from the self-hosted CI
# runner's environment, sized to its guest VM.
env:
  CARGO_TERM_COLOR: never

jobs:
  gate:
    if: github.repository == 'popodidi/axe'
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  # The macOS arm64 binary. Packaged and published by the release job with the
  # other assets. Default features: the dashboard is embedded in the Linux
  # image only.
  macos:
    needs: gate
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        env:
          AXE_GIT_COMMIT: ${{ github.sha }}
        run: cargo build --release --locked -p axe-os
      - name: Check the binary
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "axe-os"))')
          file target/release/axe | grep -q arm64
          test "$(target/release/axe --version)" = "axe $version (${GITHUB_SHA:0:12})"
          # The embedded skill installs and matches skills/axe.
          home=$(mktemp -d)
          HOME="$home" target/release/axe skill install --no-link
          diff -r -x .axe-skill.json skills/axe "$home/.agents/skills/axe"
      - uses: actions/upload-artifact@v4
        with:
          name: axe-macos-aarch64
          path: target/release/axe
          if-no-files-found: error
          retention-days: 3

  release:
    needs: [gate, macos]
    runs-on: [self-hosted, hlab-ci]
    timeout-minutes: 120
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/popodidi/axe
      # Push, log in and publish only for a v* tag; a dry-run branch publishes nothing.
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # All branches, for the on-main check.
          fetch-depth: 0
      - name: Tagged commit is on main
        if: env.PUBLISH == 'true'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches the crate version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "axe-os"))')
          if [ "$PUBLISH" = true ]; then
            test "v$version" = "$REF_NAME" || { echo "tag $REF_NAME does not match axe-os $version"; exit 1; }
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked -p axe-os
      - name: Log in with this workflow's package token
        if: env.PUBLISH == 'true'
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Build and push the image
        # Single-platform manifest (no attestation index) so the recorded digest
        # is the one kubelet reports as the pod imageID. BUILDX_BUILDER is the
        # runner's parallelism-limited builder.
        run: |
          set -euo pipefail
          # A dry run loads the image into the local daemon instead of pushing.
          output=--push; [ "$PUBLISH" = true ] || output=--load
          docker buildx build . \
            --platform linux/amd64 --provenance=false --sbom=false \
            --build-arg "GIT_COMMIT=$GITHUB_SHA" \
            --build-arg "CARGO_BUILD_JOBS=${CARGO_BUILD_JOBS:-1}" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --tag "$IMAGE:$TAG" "$output" --metadata-file "$RUNNER_TEMP/build.json"
          digest=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("containerimage.digest", ""))' "$RUNNER_TEMP/build.json")
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          # A loaded image has no registry digest to address it by.
          if [ "$PUBLISH" = true ]; then ref="$IMAGE@$digest"; else ref="$IMAGE:$TAG"; fi
          echo "IMAGE_REF=$ref" >> "$GITHUB_ENV"
      - name: Smoke-test the image
        run: |
          set -euo pipefail
          [ "$PUBLISH" != true ] || docker pull "$IMAGE_REF"
          scripts/smoke_image.sh "$IMAGE_REF" "$GITHUB_SHA" "$VERSION"
      - uses: actions/download-artifact@v4
        with:
          name: axe-macos-aarch64
          path: ${{ runner.temp }}/macos
      - name: Package assets
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/dist" stage="$RUNNER_TEMP/stage"
          rm -rf "$dist" "$stage" && mkdir -p "$dist" "$stage/bin" "$stage/macos"
          cid=$(docker create "$IMAGE_REF")
          docker cp "$cid:/usr/local/bin/axe" "$stage/bin/axe"
          docker rm "$cid" >/dev/null
          test "$("$stage/bin/axe" --version)" = "axe $VERSION (${GITHUB_SHA:0:12})"
          # The embedded skill installs and matches skills/axe.
          home=$(mktemp -d)
          HOME="$home" "$stage/bin/axe" skill install --no-link
          diff -r -x .axe-skill.json skills/axe "$home/.agents/skills/axe"
          rm -rf "$home"
          cp LICENSE-MIT LICENSE-APACHE README.md "$stage/bin/"
          # The macos job's binary (an artifact loses the mode bits).
          install -m 755 "$RUNNER_TEMP/macos/axe" "$stage/macos/axe"
          cp LICENSE-MIT LICENSE-APACHE README.md "$stage/macos/"
          bin="axe-$TAG-linux-x86_64.tar.gz" mac="axe-$TAG-macos-aarch64.tar.gz" skills="axe-skills-$TAG.tar.gz"
          tar --sort=name --owner=0 --group=0 --numeric-owner -czf "$dist/$bin" -C "$stage/bin" axe LICENSE-MIT LICENSE-APACHE README.md
          tar --sort=name --owner=0 --group=0 --numeric-owner -czf "$dist/$mac" -C "$stage/macos" axe LICENSE-MIT LICENSE-APACHE README.md
          tar --sort=name --owner=0 --group=0 --numeric-owner -czf "$dist/$skills" -C skills axe
          cd "$dist"
          for f in "$bin" "$mac" "$skills"; do sha256sum "$f" > "$f.sha256"; done
          sha256sum "$bin" "$mac" "$skills" > SHA256SUMS
          sha256sum -c SHA256SUMS
          {
            echo "axe $VERSION, commit $GITHUB_SHA."
            echo
            echo "## Image"
            echo
            echo '```'
            echo "$IMAGE:$TAG@$IMAGE_DIGEST"
            echo '```'
            echo
            echo "## Assets (sha256)"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
            echo
            echo "The binaries are Linux x86_64 (glibc 2.36+) and macOS arm64; \`axe upgrade\` installs the one for its platform. Other platforms install from source:"
            echo
            echo '```'
            echo "cargo install --locked --git https://github.com/$GITHUB_REPOSITORY --tag $TAG axe-os"
            echo '```'
            echo
            echo "Built by run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          } > "$RUNNER_TEMP/notes.md"
          echo "DIST=$dist" >> "$GITHUB_ENV"
      - name: Publish the GitHub release
        if: env.PUBLISH == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pre=(); case "$TAG" in *-*) pre=(--prerelease) ;; esac
          python3 scripts/github_release.py --repo "$GITHUB_REPOSITORY" --tag "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" "${pre[@]}" "$DIST"/*
          echo "image: $IMAGE:$TAG@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Log out
        if: always() && env.PUBLISH == 'true'
        run: docker logout ghcr.io
      - name: Remove the dry-run image
        if: always() && env.PUBLISH != 'true'
        run: docker image rm "$IMAGE:${TAG:-none}" || true

      # The self-hosted PR VM is persistent: free this job's outputs (see ci.yml).
      - name: Free the runner's disk
        if: always()
        run: rm -rf target "$RUNNER_TEMP/dist" "$RUNNER_TEMP/stage" "$RUNNER_TEMP/macos" && df -B1 /
