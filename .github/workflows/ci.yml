name: ci

# Pull requests run the fast checks: default-feature fmt, clippy and tests, the
# TS types test, and the web job when the dashboard changed
# (scripts/ci_scope.py). release.yml calls this workflow with `full: true` on a
# v* tag (and its workflow_dispatch dry run): that adds the
# --no-default-features and embed-ui variants and always runs the web job.
# Pushes to main run nothing: the pull request's run covers the merged code.
on:
  pull_request:
  workflow_call:
    inputs:
      full:
        description: Also run the --no-default-features and embed-ui variants and the web job
        type: boolean
        default: false

permissions:
  contents: read

# A new push to a pull request cancels its superseded run, so the single CI
# runner slot only works on the latest head. A release gate run is never
# cancelled. The `ci-` prefix keeps this group apart from the calling
# release.yml run's own group (github.workflow is the caller's name there).
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Build parallelism (CARGO_BUILD_JOBS, MAKEFLAGS) comes from the self-hosted CI
# runner's environment, sized to its guest VM.
env:
  CARGO_TERM_COLOR: never

jobs:
  rust:
    # Same-repository branches only: fork pull requests get no CI.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, hlab-ci]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        if: inputs.full
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Build cache on the runner's persistent cache disk (size-capped).
      - name: Build cache
        run: scripts/ci_sccache.sh setup
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Web API types are current
        run: cargo test --locked --features ts --test ts_bindings
      # Release gate only (full): the feature variants.
      - name: Clippy (no default features)
        if: inputs.full
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - name: Test (no default features)
        if: inputs.full
        run: cargo test --locked --no-default-features
      - name: Build the dashboard for embedding
        if: inputs.full
        run: cd web && npm ci && npm run build
      - name: Clippy (embed-ui)
        if: inputs.full
        run: cargo clippy --locked --all-targets --features embed-ui -- -D warnings
      - name: Build and test (embed-ui)
        if: inputs.full
        run: cargo build --locked --features embed-ui && cargo test --locked --features embed-ui --test embed_ui
      - name: Build cache stats
        if: always()
        run: scripts/ci_sccache.sh stats

      # The self-hosted PR VM is persistent and each runner slot keeps one work
      # directory for both jobs, so build outputs would stay on the guest's
      # 30 GiB root until the next checkout in that slot. Remove every job's
      # outputs after each job (also on failure, cancellation or a refused
      # start) so later jobs keep the job-start hook's 15 GiB free-space floor.
      - name: Free the runner's disk
        if: always()
        run: rm -rf target web/node_modules web/.next web/out web/.playwright web/test-results web/playwright-report && df -B1 / && { df -B1 /var/cache/hlab-ci/deps || true; }

  web:
    # Same-repository branches only: fork pull requests get no CI.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, hlab-ci]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The pull_request merge commit and its base parent, for ci_scope.py.
          fetch-depth: 2
      - name: Select checks
        id: scope
        if: ${{ !inputs.full }}
        run: python3 scripts/ci_scope.py scope
      - uses: actions/setup-node@v4
        if: inputs.full || steps.scope.outputs.ui == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Lint, typecheck, unit tests and build
        if: inputs.full || steps.scope.outputs.ui == 'true'
        run: cd web && npm ci && npm run lint && npm run typecheck && npm test && npm run build
      - name: Browser tests
        if: inputs.full || steps.scope.outputs.ui == 'true'
        run: cd web && npx playwright install chromium && npm run test:browser -- --workers=1

      # The self-hosted PR VM is persistent and each runner slot keeps one work
      # directory for both jobs, so build outputs would stay on the guest's
      # 30 GiB root until the next checkout in that slot. Remove every job's
      # outputs after each job (also on failure, cancellation or a refused
      # start) so later jobs keep the job-start hook's 15 GiB free-space floor.
      - name: Free the runner's disk
        if: always()
        run: rm -rf target web/node_modules web/.next web/out web/.playwright web/test-results web/playwright-report && df -B1 / && { df -B1 /var/cache/hlab-ci/deps || true; }
