name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

# A new push to the same branch cancels its superseded run, so the single CI
# runner slot only works on the latest head.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: "1"
  CARGO_TERM_COLOR: never

jobs:
  rust:
    # Same-repository branches only: fork pull requests get no CI.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, hlab-ci]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Test (no default features)
        run: cargo test --locked --no-default-features
      - name: Web API types are current
        run: cargo test --locked --features ts --test ts_bindings
      - name: Build the dashboard for embedding
        run: cd web && npm ci && npm run build
      - name: Clippy (embed-ui)
        run: cargo clippy --locked --all-targets --features embed-ui -- -D warnings
      - name: Build and test (embed-ui)
        run: cargo build --locked --features embed-ui && cargo test --locked --features embed-ui --test embed_ui

      # The hlab-ci PR VM is persistent and each runner slot keeps its work
      # directory, so build outputs would stay on the guest's 30 GiB root
      # until the next checkout in that slot. Remove them after every job
      # (also on failure or cancellation) so later jobs keep the job-start
      # hook's 15 GiB free-space floor.
      - name: Free the runner's disk
        if: always()
        run: rm -rf target web/node_modules web/.next web/out && df -B1 /

  web:
    # Same-repository branches only: fork pull requests get no CI.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, hlab-ci]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Lint, typecheck, unit tests and build
        run: cd web && npm ci && npm run lint && npm run typecheck && npm test && npm run build
      - name: Browser tests
        run: cd web && npx playwright install chromium && npm run test:browser -- --workers=1

      # The hlab-ci PR VM is persistent and each runner slot keeps its work
      # directory, so build outputs would stay on the guest's 30 GiB root
      # until the next checkout in that slot. Remove them after every job
      # (also on failure or cancellation) so later jobs keep the job-start
      # hook's 15 GiB free-space floor.
      - name: Free the runner's disk
        if: always()
        run: rm -rf web/node_modules web/.next web/out web/.playwright web/test-results web/playwright-report && df -B1 /
